<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}学术文献检索系统{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#0E42D2',
                    },
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center">
                        <i class="fa fa-book text-primary text-2xl mr-3"></i>
                        <span class="text-xl font-bold text-gray-800">学术文献检索系统</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    {% if session.username %}
                        <a href="/search" class="text-gray-600 hover:text-primary transition-colors px-3 py-2 rounded-md">
                            <i class="fa fa-search mr-1"></i>检索
                        </a>
                        <a href="/history" class="text-gray-600 hover:text-primary transition-colors px-3 py-2 rounded-md">
                            <i class="fa fa-history mr-1"></i>历史
                        </a>
                        <a href="/stats" class="text-gray-600 hover:text-primary transition-colors px-3 py-2 rounded-md">
                            <i class="fa fa-bar-chart mr-1"></i>统计
                        </a>
                    <a href="/upload" class="text-gray-600 hover:text-primary transition-colors px-3 py-2 rounded-md">
                        <i class="fa fa-upload mr-1"></i>
                        上传

<!-- 导航栏中，「上传」之后的这段就是修改后的内容 -->
<a href="/my_documents" class="text-gray-600 hover:text-primary transition-colors px-3 py-2 rounded-md">
    <i class="fa fa-file-text mr-1"></i>我的文献
</a>

 <!-- 新增的：我的收藏入口，星星图标 -->
 <a href="/favorites" class="text-gray-600 hover:text-primary transition-colors px-3 py-2 rounded-md">
    <i class="fa fa-star-o mr-1"></i>我的收藏
</a>

<!-- 在导航的「我的论文」与欢迎语之间，添加了这段 -->
<a href="/profile" class="text-gray-600 hover:text-primary transition-colors px-3 py-2 rounded-md">
    <i class="fa fa-user mr-1"></i>个人信息
</a>

</a>
                        <div class="w-px h-6 bg-gray-200 mx-2"></div>
                        <span class="text-gray-600">欢迎，{{ session.username }}</span>
                        <a href="/logout" class="text-gray-600 hover:text-primary transition-colors px-3 py-2 rounded-md">
                            <i class="fa fa-sign-out mr-1"></i>退出
                        </a>
                    {% else %}
                        <a href="/login" class="text-gray-600 hover:text-primary transition-colors px-3 py-2 rounded-md">登录</a>
                        <a href="/register" class="bg-primary text-white px-4 py-2 rounded-md hover:bg-secondary transition-colors">注册</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- 统一页脚 - 以后改这里就可以了！ -->
 <footer class="bg-gray-800 text-white py-8 mt-20">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <p class="text-gray-400 mb-2">© 2026 南京农业大学 | 理学院本科生 | 丁俊杰 独立制作</p>
        <p class="text-gray-500 text-sm">
            联系邮箱：<a href="mailto:hainuo@stu.njau.edu.cn" class="hover:text-primary transition-colors">hainuo@stu.njau.edu.cn</a>
        </p>
    </div>
</footer>

    {% block extra_script %}{% endblock %}
</body>
</html>
