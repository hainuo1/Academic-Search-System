{% extends "base.html" %}

{% block title %}
忘记密码
{% endblock %}

{% block content %}

<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-lg shadow">

    <h2 class="text-2xl font-bold mb-6 text-center">
        找回密码
    </h2>

    {% if error %}
    <div class="bg-red-100 text-red-700 p-3 rounded mb-4">
        {{ error }}
    </div>
    {% endif %}

    {% if success %}
    <div class="bg-green-100 text-green-700 p-3 rounded mb-4">
        {{ success }}
    </div>
    {% endif %}

    <form method="post">

        <div class="mb-4">
            <label class="block mb-2">用户名</label>
            <input
                type="text"
                name="username"
                required
                class="w-full border rounded p-2"
            >
        </div>

        <div class="mb-4">
            <label class="block mb-2">注册邮箱</label>
            <input
                type="email"
                name="email"
                required
                class="w-full border rounded p-2"
            >
        </div>

        <div class="mb-4">
            <label class="block mb-2">新密码</label>
            <input
                type="password"
                name="password"
                required
                class="w-full border rounded p-2"
            >
        </div>

        <div class="mb-6">
            <label class="block mb-2">确认密码</label>
            <input
                type="password"
                name="confirm_password"
                required
                class="w-full border rounded p-2"
            >
        </div>

        <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded"
        >
            重置密码
        </button>

    </form>

</div>

{% endblock %}
