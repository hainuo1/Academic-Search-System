{% extends "base.html" %}

{% block title %}设置引用关系 - 学术文献检索系统{% endblock %}

{% block content %}
<div class="container mx-auto p-6">
    <div class="bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-2xl font-bold mb-4">设置引用关系</h2>

        <div class="bg-blue-50 p-4 rounded mb-6">
            当前文献：
            <strong>{{ current_doc.Title }}</strong>
        </div>

        <div class="mb-4">
            <input type="text" id="keyword" placeholder="输入标题搜索文献"
                   class="border rounded p-2 w-full input-focus">
        </div>

        <button onclick="searchDocument()"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
            搜索文献
        </button>

        <form method="post" action="{{ url_for('citation.save_citation', doc_id=current_doc.DocumentID) }}">
            <div id="resultArea" class="mt-6">
                <!-- 动态渲染结果 -->
            </div>
            <button type="submit"
                    class="mt-6 bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition">
                保存引用关系
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_script %}
<!-- 注入全局变量供 citation.js 使用 -->
<script>
    // 当前文献 ID
    const CURRENT_DOC_ID = {{ current_doc.DocumentID }};
    // 已选中的目标文献 ID 列表
    const SELECTED_IDS = {{ selected_ids|tojson }};
</script>
<!-- 引用页专属 JS -->
<script src="{{ url_for('static', filename='js/citation.js') }}" defer></script>
{% endblock %}
